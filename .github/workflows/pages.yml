
name: GitHub Pages veröffentlichen

on:
  workflow_dispatch:
    inputs:
      deployment_bestaetigt:
        description: 'Veröffentlichung des Test-Frontends ausdrücklich freigeben'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.repository == 'nordlicht78/RezeptShare' && inputs.deployment_bestaetigt == true
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
